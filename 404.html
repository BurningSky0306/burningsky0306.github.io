<!DOCTYPE html>
<!-- GitHub Pages 对任何不存在的路径都返回这一页（Hugo 生成的 404 页在各语言目录下）。它只负责分流：
     · 已带语言前缀（/en/xxx 不存在）→ 该语言的 404 页
     · 无前缀的旧分类/标签单项页（/tags/xxx/）→ 访客语言的分类/标签总页（改版时词表已重整，不逐词对应）
     · 其余无前缀路径 → 补上访客语言的前缀再试一次（仍不存在就落到上一条，最多两跳）
     挑语言的规则与 layouts/alias.html 一致，改一处要同步另一处。 -->
<html>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>404</title>
<script>
  (() => {
    const langs = ['zh-hans', 'zh-hant', 'en', 'fr'], p = location.pathname;
    const first = p.split('/')[1];
    if (langs.includes(first)) return location.replace(`/${first}/404.html`);
    let lang;
    try { lang = localStorage.getItem('lang'); } catch (e) {}
    if (!langs.includes(lang)) {
      lang = 'en';
      for (const t of navigator.languages || [navigator.language || '']) {
        const l = t.toLowerCase();
        const m = /^zh-(tw|hk|mo|hant)\b/.test(l) ? 'zh-hant' : /^zh\b/.test(l) ? 'zh-hans' : /^(en|fr)\b/.test(l) ? l.slice(0, 2) : '';
        if (m) { lang = m; break; }
      }
    }
    const tax = p.match(/^\/(categories|tags)\/./);
    location.replace(tax ? `/${lang}/${tax[1]}/` : `/${lang}${p}${location.search}${location.hash}`);
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/en/404.html"></noscript>
</head>
<body></body>
</html>
